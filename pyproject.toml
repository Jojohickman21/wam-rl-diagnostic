[project]
name = "wam-rl-diagnostic"
version = "0.1.0"
description = "RL diagnostic for whole-arm contact manipulation: WACL CloseCabinet on an xArm 7 in MuJoCo."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mujoco==4.0.1",
    "gymnasium==0.29.1",
    "numpy==1.26.4",
    "torch==2.4.1",
    "tyro==1.0.17",
    "tensorboard==2.21.0",
    "wandb==0.31.0",
    "imageio[ffmpeg]==2.38.1",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
